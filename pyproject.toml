[project]
name = "acidcode"
version = "1.0.4"
description = "AcidCode — терминальный кодовый ассистент"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.89",
    "httpx>=0.27",
    "rich>=13.9",
]

[project.scripts]
acidcode = "acidcode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acidcode"]
